<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ramp Controller</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body { font-family: Helvetica; background:#f5f7fb; display:flex; margin:0; height:100vh;}
#left { width:30%; padding:20px;}
#right { width:70%; padding:20px;}
button { font-size:30px; padding:15px; margin:10px 0; width:100%; background:#2563eb; color:white; border:none; border-radius:10px;}
.card { background:white; padding:20px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.1); margin-bottom:20px;}
.value { font-size:30px;}
</style>
</head>

<body>

<div id="left">
<div class="card">
<button onclick="connect()">Connect</button>
<button onclick="send('START')">Start</button>
<button onclick="send('STOP')">Stop</button>
</div>

<div class="card">
<div>Time: <span id="time" class="value">0</span></div>
<div>Temp: <span id="temp" class="value">0</span></div>
<div>Target: <span id="target" class="value">0</span></div>
</div>
</div>

<div id="right">
<canvas id="chart"></canvas>
</div>

<script>
let port, reader, writer;

let buffer = ""; // FIX: handles split serial packets

let expectedTime = [];
let expectedTemp = [];

let actualData = [];

let receivingProfile = false;
let profileReceived = false;

let lastChartUpdate = 0;

const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label:'Expected', data:[], borderWidth:2 },
      { label:'Actual', data:[], borderWidth:2 }
    ]
  },
  options: {
    animation:false,
    responsive:true,
    scales: {
      x: { title:{display:true,text:'Time (s)'} },
      y: { title:{display:true,text:'Temp (°C)'}, min:0 }
    }
  }
});

async function connect() {

  port = await navigator.serial.requestPort();
  await port.open({ baudRate: 115200 });

  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  reader = decoder.readable.getReader();

  const encoder = new TextEncoderStream();
  encoder.readable.pipeTo(port.writable);
  writer = encoder.writable.getWriter();

  readLoop();

  // request profile after boot delay
  setTimeout(() => send("PROFILE"), 3000);
}

async function readLoop() {

  while (true) {

    const { value, done } = await reader.read();
    if (done) break;

    buffer += value;

    let lines = buffer.split("\n");
    buffer = lines.pop(); // keep incomplete line

    for (let line of lines) processLine(line.trim());
  }
}

function processLine(line) {

  if (line === "PROFILE_START") {
    expectedTime = [];
    expectedTemp = [];
    actualData = [];
    receivingProfile = true;
    return;
  }

  if (line === "PROFILE_END") {
    receivingProfile = false;

    // build labels from 0 → max time
    let maxTime = expectedTime[expectedTime.length - 1];

    let labels = [];
    let expectedFull = [];
    let actualFull = [];

    let index = 0;

    for (let t = 0; t <= maxTime; t++) {

      labels.push(t);

      // move to next segment
      if (index < expectedTime.length - 1 && t > expectedTime[index + 1]) {
        index++;
      }

      // linear interpolation between points
      let t0 = expectedTime[index];
      let t1 = expectedTime[Math.min(index + 1, expectedTime.length - 1)];

      let y0 = expectedTemp[index];
      let y1 = expectedTemp[Math.min(index + 1, expectedTemp.length - 1)];

      let temp;

      if (t1 === t0) temp = y0;
      else temp = y0 + (t - t0) * (y1 - y0) / (t1 - t0);

      expectedFull.push(temp);
      actualFull.push(null);
    }

    chart.data.labels = labels;
    chart.data.datasets[0].data = expectedFull;
    chart.data.datasets[1].data = actualFull;

    chart.update();
    return;
  }

  let parts = line.split(",");

  // PROFILE POINTS
  if (receivingProfile && parts[0] === "P") {
    expectedTime.push(Number(parts[1]));
    expectedTemp.push(Number(parts[2]));
    return;
  }

  // LIVE DATA
  if (parts[0] === "D") {

    let t = Number(parts[1]);
    let temp = Number(parts[2]);
    let target = Number(parts[3]);

    document.getElementById("time").innerText = t;
    document.getElementById("temp").innerText = temp.toFixed(1);
    document.getElementById("target").innerText = target.toFixed(1);

    if (t < chart.data.datasets[1].data.length) {
      chart.data.datasets[1].data[t] = temp;
    }

    if (millis() - lastChartUpdate > 300) {
      chart.update();
      lastChartUpdate = millis();
    }
  }
}

function send(cmd) {
  if (writer) writer.write(cmd + "\n");
}

// simple millis replacement
function millis() {
  return Date.now();
}
</script>
</body>
</html>
